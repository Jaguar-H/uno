<!-- UNO TABLE SCREEN MOCKUP -->
<div class="uno-table">

  <!-- CENTER DECK -->
  <div class="center-area">
    <div class="draw-pile uno-card back"></div>

    <div class="discard-pile">
      <div class="uno-card blue">3</div>
      <div class="uno-card yellow reverse">⟲</div>
      <div class="uno-card wild">★</div>
    </div>

    <!-- ACTION POPUP -->
    <div class="challenge-popup">
      <button class="btn challenge">Challenge</button>
      <button class="btn decline">Decline</button>
    </div>
  </div>

  <!-- TOP PLAYER -->
  <div class="player top">
    <div class="player-info">
      <img src="avatar1.png" alt="" />
      <span>AI Luna</span>
      <div class="card-count">2</div>
    </div>

    <div class="cards horizontal">
      <div class="uno-card back small"></div>
      <div class="uno-card back small"></div>
    </div>
  </div>

  <!-- LEFT PLAYER -->
  <div class="player left">
    <div class="player-info">
      <img src="avatar2.png" alt="" />
      <span>AI Dusty</span>
    </div>

    <div class="cards vertical">
      <div class="uno-card back small"></div>
      <div class="uno-card back small"></div>
      <div class="uno-card back small"></div>
      <div class="uno-card back small"></div>
    </div>
  </div>

  <!-- RIGHT PLAYER -->
  <div class="player right">
    <div class="player-info">
      <img src="avatar3.png" alt="" />
      <span>AI Pudding</span>
      <div class="card-count">11</div>
    </div>

    <div class="cards vertical spread">
      <div class="uno-card back small"></div>
      <div class="uno-card back small"></div>
      <div class="uno-card back small"></div>
      <div class="uno-card back small"></div>
      <div class="uno-card back small"></div>
      <div class="uno-card back small"></div>
    </div>
  </div>

  <!-- BOTTOM PLAYER -->
  <div class="player bottom">
    <div class="player-info">
      <img src="avatar4.png" alt="" />
      <span>UNOLover</span>
      <div class="card-count">6</div>
    </div>

    <div class="cards player-hand">
      <div class="uno-card green">1</div>
      <div class="uno-card green">2</div>
      <div class="uno-card green">3</div>
      <div class="uno-card green">5</div>
      <div class="uno-card green">8</div>
      <div class="uno-card blue">1</div>
    </div>
  </div>

</div>
